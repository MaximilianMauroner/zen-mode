name: Android nightly Internal release

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Europe/Vienna
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zen-mode-nightly
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # Compare-and-swap ledger.json on release-state.
    steps:
      - name: Set ephemeral paths
        run: |
          echo "RELEASE_ARTIFACTS_DIR=$RUNNER_TEMP/release-artifacts" >> "$GITHUB_ENV"
          echo "PLAY_SERVICE_ACCOUNT_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
          echo "ANDROID_BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare runner tools and space
        shell: bash
        run: |
          set -euo pipefail
          # These preinstalled toolchains are unrelated to this Android build.
          if [ "$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)" -lt 32212254720 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          fi
          test "$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)" -ge 16106127360
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 8388608
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          curl --fail --silent --show-error --location \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$ANDROID_BUNDLETOOL_JAR"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$ANDROID_BUNDLETOOL_JAR" | sha256sum --check --status
          npm install --global eas-cli@20.5.1
      - name: Prepare ephemeral Play key
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          if not os.environ.get('EXPO_TOKEN') or not os.environ.get('PLAY_SERVICE_ACCOUNT_JSON'):
              sys.exit('EXPO_TOKEN and PLAY_SERVICE_ACCOUNT_JSON are required')
          try:
              key = json.loads(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
              if key.get('type') != 'service_account' or not key.get('client_email') or not key.get('private_key'):
                  raise ValueError()
          except (ValueError, AttributeError):
              sys.exit('PLAY_SERVICE_ACCOUNT_JSON must be a full service-account JSON key')
          fd = os.open(os.environ['PLAY_SERVICE_ACCOUNT_KEY_PATH'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as output:
              json.dump(key, output)
          PY
      - name: Check fetched main, reserve, build, verify and upload Internal
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/nightly-release.mjs run
      - name: Retain verified artifacts and sanitized evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zen-mode-nightly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-artifacts/**/verified/*.apk
            ${{ runner.temp }}/release-artifacts/**/verified/*.aab
            ${{ runner.temp }}/release-artifacts/**/release.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove ephemeral credentials and private logs
        if: always()
        run: |
          rm -f "$PLAY_SERVICE_ACCOUNT_KEY_PATH"
          rm -rf "$HOME/.local/state/lab4code-releases/logs/zen-mode"
