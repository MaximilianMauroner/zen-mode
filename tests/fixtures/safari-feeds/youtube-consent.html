<!doctype html>
<!-- Mobile capture from https://m.youtube.com/?ra=m. Trimmed to the tested markup. -->
<html lang="en">
  <body>
    <ytm-app id="app">
      <ytm-pivot-bar-renderer role="tablist">
        <ytm-pivot-bar-item-renderer>
          <div role="tab" class="pivot-bar-item-tab pivot-w2w" aria-selected="true">
            <div class="pivot-bar-item-title pivot-w2w">
              <span role="text">Home</span>
            </div>
          </div>
        </ytm-pivot-bar-item-renderer>
        <ytm-pivot-bar-item-renderer>
          <div role="tab" class="pivot-bar-item-tab pivot-shorts" aria-selected="false">
            <div class="pivot-bar-item-title pivot-shorts">
              <span role="text">Shorts</span>
            </div>
          </div>
        </ytm-pivot-bar-item-renderer>
        <ytm-pivot-bar-item-renderer>
          <div role="tab" class="pivot-bar-item-tab pivot-subs" aria-selected="false">
            <div class="pivot-bar-item-title pivot-subs">
              <span role="text">Subscriptions</span>
            </div>
          </div>
        </ytm-pivot-bar-item-renderer>
        <ytm-pivot-bar-item-renderer>
          <div role="tab" class="pivot-bar-item-tab pivot-you" aria-selected="false">
            <div class="pivot-bar-item-title pivot-you">
              <span role="text">You</span>
            </div>
          </div>
        </ytm-pivot-bar-item-renderer>
      </ytm-pivot-bar-renderer>
      <ytm-consent-bump-v2-renderer>
        <div>
          <div>
            <h2>
              <span role="text">Before you continue to YouTube</span>
            </h2>
          </div>
        </div>
      </ytm-consent-bump-v2-renderer>
    </ytm-app>
  </body>
</html>
