plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.maxmauroner.zenguard'
version = '0.1.0'

android {
  namespace "com.maxmauroner.zenguard"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError true
  }
  testOptions {
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
